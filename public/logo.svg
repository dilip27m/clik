<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121516"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>

    <!-- Emerald Crystal Gradients -->
    <linearGradient id="emeraldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="emeraldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ambient Glow Behind Crystal -->
  <circle cx="256" cy="240" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="70" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Document / Transit Pass Graphic Silhouette Behind Crystal -->
  <g opacity="0.35">
    <path d="M168 120 L310 120 L344 154 L344 380 L168 380 Z" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <path d="M310 120 L310 154 L344 154" fill="#27272a" stroke="#3f3f46" stroke-width="3"/>
    <!-- Form lines -->
    <line x1="192" y1="180" x2="270" y2="180" stroke="#52525b" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="205" x2="320" y2="205" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="230" x2="300" y2="230" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="255" x2="320" y2="255" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central Faceted Mineral Gemstone / Crystal (Barytes Hexagonal Pyramid) -->
  <g id="crystalGroup" filter="url(#borderGlow)">
    <!-- Main Center Prism Top -->
    <polygon points="256,108 340,192 256,236 172,192" fill="url(#emeraldLight)"/>
    
    <!-- Left Facet -->
    <polygon points="172,192 256,236 256,368 172,298" fill="url(#emeraldMain)"/>

    <!-- Right Facet -->
    <polygon points="256,236 340,192 340,298 256,368" fill="url(#emeraldDark)"/>

    <!-- Center Apex Highlight Facet -->
    <polygon points="256,108 280,180 256,236 232,180" fill="url(#goldGrad)" opacity="0.95"/>

    <!-- Left Outer Shard -->
    <polygon points="172,192 120,240 148,316 172,298" fill="#047857" opacity="0.85"/>
    <polygon points="172,192 148,156 120,240" fill="#10b981" opacity="0.75"/>

    <!-- Right Outer Shard -->
    <polygon points="340,192 392,240 364,316 340,298" fill="#065f46" opacity="0.85"/>
    <polygon points="340,192 364,156 392,240" fill="#34d399" opacity="0.75"/>

    <!-- Internal Facet Lines -->
    <line x1="256" y1="108" x2="256" y2="368" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="172" y1="192" x2="340" y2="192" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Laser / Scanner Beam across the crystal -->
  <g opacity="0.85">
    <line x1="100" y1="240" x2="412" y2="240" stroke="#34d399" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="100" cy="240" r="4" fill="#34d399"/>
    <circle cx="412" cy="240" r="4" fill="#34d399"/>
  </g>

  <!-- Typography: AP MINES -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="8" fill="#ffffff" text-anchor="middle">
    AP MINES
  </text>
  <text x="256" y="444" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#10b981" text-anchor="middle">
    TRANSIT // PORTAL
  </text>
</svg>
