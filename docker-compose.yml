services:
  postgres:
    image: postgres:16-alpine
    container_name: transit_ocr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transit_db
    ports:
      - "5433:5432"
    volumes:
      - transit_pgdata:/var/lib/postgresql/data

volumes:
  transit_pgdata:
    driver: local
